[package]
name = "dc-ui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Tarahi desktop application (Visio-compatible diagram editor)"

# Distribution name for the GUI binary (packaging + desktop entry).
[[bin]]
name = "tarahi"
path = "src/main.rs"

[package.metadata.deb]
name = "tarahi"
# Rename transition (CodeRabbit PR #277): the package was
# `diagramcraft`, and it already shipped packaging/tarahi.desktop
# (the desktop entry was renamed ahead of the package) — so the two
# packages SHARE usr/share/applications/tarahi.desktop. Replaces
# licenses the file takeover on upgrade; Breaks moves the old
# package out. Conflicts is unnecessary (nothing else collides).
replaces = ["diagramcraft"]
breaks = ["diagramcraft"]
maintainer = "Tarahi contributors"
depends = "$auto"
section = "graphics"
priority = "optional"
extended-description = """Native Linux diagram editor for Visio files: read, render, edit and
write .vsdx/.vstx/.vssx packages losslessly, with a Visio-style ribbon
GUI, stencils and ShapeSheet inspector."""
assets = [
    ["target/release/tarahi", "usr/bin/", "755"],
    ["../../packaging/tarahi.desktop", "usr/share/applications/", "644"],
    ["../../packaging/tarahi.png", "usr/share/icons/hicolor/512x512/apps/tarahi.png", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/tarahi/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/tarahi/LICENSE-APACHE", "644"],
    # Every vendored asset's license accompanies the package (PR #299
    # review: the hunspell dictionaries' notices require it; the flat
    # names match packaging/collect-licenses.sh's staging).
    ["../../crates/dc/assets/fonts/LICENSE-Carlito", "usr/share/doc/tarahi/LICENSE-font-Carlito", "644"],
    ["../../crates/dc/assets/fonts/LICENSE-Liberation", "usr/share/doc/tarahi/LICENSE-font-Liberation", "644"],
    ["../../crates/dc/assets/fonts/vazirmatn/OFL.txt", "usr/share/doc/tarahi/LICENSE-font-Vazirmatn-OFL", "644"],
    ["../../crates/dc/assets/fonts/noto-sc/OFL.txt", "usr/share/doc/tarahi/LICENSE-font-NotoSansSC-OFL", "644"],
    ["../../crates/dc/assets/fonts/noto-jp/OFL.txt", "usr/share/doc/tarahi/LICENSE-font-NotoSansJP-OFL", "644"],
    ["../../crates/dc/assets/fonts/noto-kr/OFL.txt", "usr/share/doc/tarahi/LICENSE-font-NotoSansKR-OFL", "644"],
    ["../../crates/dc-ui/assets/fonts/opensans/OFL.txt", "usr/share/doc/tarahi/LICENSE-font-OpenSans-OFL", "644"],
    ["../../crates/dc/assets/dictionaries/en_US/LICENSE-en_US.txt", "usr/share/doc/tarahi/LICENSE-dict-en-US", "644"],
    ["../../crates/dc/assets/dictionaries/en_US/README.txt", "usr/share/doc/tarahi/README-dict-en_US", "644"],
    ["../../crates/dc/assets/dictionaries/en_US/README_en_US.txt", "usr/share/doc/tarahi/README-dict-en_US-wordlist", "644"],
    ["../../crates/dc/assets/dictionaries/de_DE/COPYING.GPLv2", "usr/share/doc/tarahi/LICENSE-dict-de-DE-GPLv2", "644"],
    ["../../crates/dc/assets/dictionaries/de_DE/COPYING.GPLv3", "usr/share/doc/tarahi/LICENSE-dict-de-DE-GPLv3", "644"],
    ["../../crates/dc/assets/dictionaries/de_DE/README_de_DE_frami.txt", "usr/share/doc/tarahi/README-dict-de-DE-frami", "644"],
    ["../../crates/dc/assets/dictionaries/fa_IR/LICENSE", "usr/share/doc/tarahi/LICENSE-dict-fa-IR", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/tarahi", dest = "/usr/bin/tarahi", mode = "755" },
    { source = "../../packaging/tarahi.desktop", dest = "/usr/share/applications/tarahi.desktop", mode = "644" },
    { source = "../../packaging/tarahi.png", dest = "/usr/share/icons/hicolor/512x512/apps/tarahi.png", mode = "644" },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/tarahi/LICENSE-MIT", mode = "644" },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/tarahi/LICENSE-APACHE", mode = "644" },
    # Every vendored asset's license accompanies the package (PR #299
    # review; the flat names match packaging/collect-licenses.sh).
    { source = "../../crates/dc/assets/fonts/LICENSE-Carlito", dest = "/usr/share/licenses/tarahi/LICENSE-font-Carlito", mode = "644" },
    { source = "../../crates/dc/assets/fonts/LICENSE-Liberation", dest = "/usr/share/licenses/tarahi/LICENSE-font-Liberation", mode = "644" },
    { source = "../../crates/dc/assets/fonts/vazirmatn/OFL.txt", dest = "/usr/share/licenses/tarahi/LICENSE-font-Vazirmatn-OFL", mode = "644" },
    { source = "../../crates/dc/assets/fonts/noto-sc/OFL.txt", dest = "/usr/share/licenses/tarahi/LICENSE-font-NotoSansSC-OFL", mode = "644" },
    { source = "../../crates/dc/assets/fonts/noto-jp/OFL.txt", dest = "/usr/share/licenses/tarahi/LICENSE-font-NotoSansJP-OFL", mode = "644" },
    { source = "../../crates/dc/assets/fonts/noto-kr/OFL.txt", dest = "/usr/share/licenses/tarahi/LICENSE-font-NotoSansKR-OFL", mode = "644" },
    { source = "../../crates/dc-ui/assets/fonts/opensans/OFL.txt", dest = "/usr/share/licenses/tarahi/LICENSE-font-OpenSans-OFL", mode = "644" },
    { source = "../../crates/dc/assets/dictionaries/en_US/LICENSE-en_US.txt", dest = "/usr/share/licenses/tarahi/LICENSE-dict-en-US", mode = "644" },
    { source = "../../crates/dc/assets/dictionaries/en_US/README.txt", dest = "/usr/share/licenses/tarahi/README-dict-en_US", mode = "644" },
    { source = "../../crates/dc/assets/dictionaries/en_US/README_en_US.txt", dest = "/usr/share/licenses/tarahi/README-dict-en_US-wordlist", mode = "644" },
    { source = "../../crates/dc/assets/dictionaries/de_DE/COPYING.GPLv2", dest = "/usr/share/licenses/tarahi/LICENSE-dict-de-DE-GPLv2", mode = "644" },
    { source = "../../crates/dc/assets/dictionaries/de_DE/COPYING.GPLv3", dest = "/usr/share/licenses/tarahi/LICENSE-dict-de-DE-GPLv3", mode = "644" },
    { source = "../../crates/dc/assets/dictionaries/de_DE/README_de_DE_frami.txt", dest = "/usr/share/licenses/tarahi/README-dict-de-DE-frami", mode = "644" },
    { source = "../../crates/dc/assets/dictionaries/fa_IR/LICENSE", dest = "/usr/share/licenses/tarahi/LICENSE-dict-fa-IR", mode = "644" },
]

[dependencies]
# Developer ▸ Operations: polygon booleans (union/intersect/subtract/fragment)
i_overlay = "9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
craft-ui = { path = "../../third_party/craft-ui" }
anyhow.workspace = true
dc = { version = "0.1.0", path = "../dc" }
dc-core = { version = "0.1.0", path = "../dc-core" }
eframe = "0.37.0"
egui = "0.37"
resvg = "0.50.0"
serde_json = "1"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# OS clipboard image paste (#113): the same arboard eframe already
# carries (same version as Cargo.lock's).
arboard = "3.7"
vsdx = { version = "0.1.0", path = "../vsdx" }
# Digest-verified built-in extraction to My Shapes (#104).
sha2 = "0.11"
# #246 i18n: typed Fluent accessors generated from the project-level
# `locales/` catalogs (see build.rs; the generated src/l10n.rs is committed).
fluent-typed = "0.10"

[build-dependencies]
fluent-typed = { version = "0.10", features = ["build"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
regex = "1" 
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
